<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to NC II · CSS Hands-on Assessment Simulator</title>
<meta name="description" content="Walk-around simulator for TESDA Computer Systems Servicing NC II: COC1 assemble & install, COC2 networking, COC3 Windows Server.">
<meta name="theme-color" content="#0b111b">
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.min.js","three/addons/":"./assets/vendor/addons/"}}</script>
<style>
*{box-sizing:border-box}
:root{--bg:#0b111b;--panel:#121b29;--panel2:#18243a;--line:#253550;--text:#e7eef8;--muted:#8da2bf;--accent:#22c3a6;--accent2:#3b82f6;--good:#35d07f;--bad:#ff5d62;--warn:#f5a524}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit}
.hidden{display:none!important}
.btn{background:linear-gradient(135deg,var(--accent),#1aa38b);color:#03241e;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}
code{font-family:ui-monospace,Consolas,monospace;background:#0003;padding:1px 5px;border-radius:5px}
/* ---------- title ---------- */
#title{position:fixed;inset:0;overflow:auto;background:radial-gradient(900px 500px at 80% 0%,#1b3d5c88,transparent),radial-gradient(700px 500px at 0% 100%,#11423a88,transparent),var(--bg);z-index:30;padding:24px 16px}
.t-wrap{max-width:900px;margin:0 auto}
.t-logo{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.t-logo .lg{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032;font-weight:900}
.t-logo h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.1}
.t-logo small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.t-intro{color:var(--muted);max-width:700px}
.t-modes{display:grid;gap:12px;margin-top:18px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode .ic{font-size:30px;width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff0d}
.mode b{display:block;font-size:17px}.mode span{color:var(--muted);font-size:13.5px}
.mode.main{border-color:#22c3a666;background:linear-gradient(135deg,#123b38,#121b29)}
.mode .bd{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#ffffff12;color:var(--muted)}
.mode .bd.ok{background:#35d07f22;color:var(--good)}
.t-how{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted)}
.t-how b{color:var(--text)}
.t-foot{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px}
/* ---------- world ---------- */
#world{position:fixed;inset:0;background:#070b12}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(180deg,#000c,#0000);z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .coc{font-weight:800;font-size:14px}
.hud .cur{font-size:12.5px;color:#cfe;opacity:.85}
.hud .sp{flex:1}
.hud .tm{font-family:monospace;background:#0008;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.hud button{background:#0009;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px}
.prompt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000c;border:1px solid var(--accent);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;z-index:5;white-space:nowrap;pointer-events:none}
.prompt kbd{background:var(--accent);color:#032;border-radius:5px;padding:1px 6px;font-weight:800;margin-right:4px}
.joy{position:fixed;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff30;z-index:6;touch-action:none}
.joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffff55;border:2px solid #fff8}
.usebtn{position:fixed;right:22px;bottom:34px;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#032;font-weight:900;border:0;z-index:6;font-size:16px;box-shadow:0 6px 18px #0008}
.usebtn:disabled{background:#455;color:#9aa}
@media(hover:hover) and (pointer:fine){.joy,.usebtn{display:none}}
@media(max-width:600px){.prompt{bottom:150px;font-size:13px}.hud .cur{display:none}}
/* ---------- modal/toast ---------- */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:200;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:540px;width:100%;max-height:88vh;overflow:auto;animation:pop .18s}
.modal-box h2,.modal-box h3{margin-top:0}
@keyframes pop{from{transform:scale(.96);opacity:0}}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-150px);background:#1f2d44;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;z-index:300;max-width:min(92vw,520px);font-size:14px;transition:transform .3s;box-shadow:0 8px 24px #0008}
#toast.show{transform:translate(-50%,0)}#toast.good{border-color:var(--good)}#toast.bad{border-color:var(--bad)}
.result{text-align:center}.result .big{font-size:60px;font-weight:900;line-height:1}
.result.pass .big,.result.pass h2{color:var(--good)}.result.fail .big,.result.fail h2{color:var(--warn)}
.log{text-align:left;padding-left:0;list-style:none;font-size:14px}.log li{padding:6px 10px;border-radius:8px;margin:5px 0;background:var(--panel2)}
.log li.good::before{content:'✔ ';color:var(--good)}.log li.bad::before{content:'✖ ';color:var(--bad)}.log li.info::before{content:'• ';color:var(--accent)}
.npc-say{display:flex;gap:12px;align-items:flex-start}.npc-say .av{font-size:40px;line-height:1}
.tl{padding-left:20px;margin:8px 0}.tl li{margin:4px 0}.tl li.done{color:var(--good)}
/* ---------- task overlay ---------- */
#taskov{position:fixed;inset:0;z-index:50;background:#05080d;display:flex;flex-direction:column}
.tk-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0d1522;border-bottom:1px solid var(--line);flex:none}
.tk-top .tt{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-top .tt small{color:var(--muted);font-weight:400}
.tk-top button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.tk-main{flex:1;display:flex;min-height:0}
.tk-body{flex:1;min-width:0;position:relative;overflow:auto}
.tk-sheet{width:300px;flex:none;background:#fffbea;color:#3b2f12;overflow:auto;padding:14px;border-left:6px solid var(--warn)}
.tk-sheet h4{margin:0 0 4px}.tk-sheet .sub{font-size:12px;color:#6b5a2e;margin-bottom:8px}
.tk-sheet .info{font-size:12.5px;background:#0000000c;border-radius:8px;padding:8px;margin:8px 0;white-space:pre-line}
.obj{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #0002;font-size:13.5px}
.obj .ck{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid #a08a55;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.obj.ok .ck{background:#2a9d5c;border-color:#2a9d5c}.obj.ok span{text-decoration:line-through;opacity:.6}
.obj .hb{margin-left:auto;flex:none;background:#3b2f12;color:#fffbea;border:0;border-radius:6px;font-size:11px;padding:2px 7px}
.obj .hint{display:block;font-size:12px;background:#fff3c4;border-radius:6px;padding:6px;margin-top:4px;color:#5a4410}
.tk-score{font-size:12px;margin-top:10px;color:#6b5a2e}
@media(max-width:900px){.tk-sheet{position:absolute;right:0;top:0;bottom:0;z-index:40;box-shadow:-10px 0 30px #0009;width:min(320px,88vw)}.tk-sheet.closed{display:none}}
@media(min-width:901px){.tk-sheet.closed{display:none}}
.done-banner{position:absolute;inset:0;background:#000c;display:grid;place-items:center;z-index:60;padding:16px}
/* ---------- generic station panels ---------- */
.stage{padding:16px;max-width:1100px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h3,.panel h4{margin:0 0 8px}
.choices{display:grid;gap:8px}
.choice{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.choice:hover{border-color:var(--accent)}
.choice.wrong{border-color:var(--bad);opacity:.6}.choice.right{border-color:var(--good);background:#35d07f1c}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;background:linear-gradient(#5b4632,#45331f);padding:14px;border-radius:12px;border:4px solid #3a2a18}
.item{background:#f4efe6;color:#2a2a2a;border:2px solid transparent;border-radius:10px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:600;box-shadow:0 3px 0 #0004}
.item .em{font-size:34px;display:block}
.item.sel{border-color:var(--good);background:#dff7e8}.item.bad{border-color:var(--bad);background:#fde2e2}
/* assembly */
.asm{display:grid;grid-template-columns:260px 1fr;gap:12px}
@media(max-width:820px){.asm{grid-template-columns:1fr}}
.tray{display:flex;flex-direction:column;gap:6px}
@media(max-width:820px){.tray{flex-direction:row;flex-wrap:wrap}}
.part{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;display:flex;gap:8px;align-items:center}
.part.sel{border-color:var(--accent);box-shadow:0 0 0 2px #22c3a655}
.part .em{font-size:20px}
.case{position:relative;background:linear-gradient(135deg,#2a2f37,#1b1f25);border:6px solid #444b55;border-radius:10px;aspect-ratio:4/4.2;max-height:72vh;width:100%;max-width:640px;margin:0 auto}
.mat{position:relative;background:repeating-linear-gradient(45deg,#3a4a8a,#3a4a8a 6px,#34437c 6px,#34437c 12px);border-radius:10px;padding:10px;min-height:120px}
.zone{position:absolute;border:2px dashed #ffffff40;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#ffffffaa;padding:2px;background:#ffffff08}
.zone.can{border-color:var(--accent);background:#22c3a622;color:#fff;animation:glow 1s infinite;cursor:pointer}
@keyframes glow{50%{background:#22c3a644}}
.zone.fill{border-style:solid;color:#fff;font-weight:700}
.mobo{position:absolute;background:linear-gradient(135deg,#0f4d3a,#0b3a2c);border:2px solid #0a2b20;border-radius:4px}
/* crimp bench */
.bench{background:linear-gradient(#7a5a3a,#5e4329);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;border:5px solid #3f2c18}
.tool{background:#efe8dc;color:#222;border-radius:10px;padding:10px 6px;text-align:center;font-weight:700;font-size:12.5px;border:2px solid transparent;box-shadow:0 4px 0 #0005}
.tool .em{font-size:32px;display:block}.tool.wrong{border-color:var(--bad)}
.rj45{background:linear-gradient(180deg,#d9eef5d9,#b9d6e0b3);border:2px solid #9cc3d1;border-radius:16px 16px 6px 6px;padding:10px;max-width:520px;margin:10px auto}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.slot{height:110px;background:#ffffff59;border:1px dashed #6a8f9c;border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:4px;color:#183843}
.slot .pin{font-weight:800;font-size:12px;background:#c9a227;color:#3a2b00;border-radius:3px;padding:0 5px}
.slot .wire{width:60%;flex:1;border-radius:4px}
.slot small{font-size:9.5px;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.wbtn{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 10px 6px 6px;font-size:12.5px}
.sw{width:28px;height:13px;border-radius:7px;display:inline-block;flex:none}
.tester{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:8px;margin:12px 0}
.unit{background:#1d2a20;border:2px solid #39513f;border-radius:12px;padding:10px;text-align:center;font-size:12px;color:#b9d9c2}
.leds{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:8px}
.led{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-family:monospace}
.led i{width:13px;height:13px;border-radius:50%;background:#2f3b31}
.led.on i{background:#7dff8a;box-shadow:0 0 10px #7dff8a}
.cablebar{height:8px;background:repeating-linear-gradient(90deg,#2b7fd6 0 8px,#1f5fa3 8px 16px);border-radius:4px}
@media(max-width:560px){.tester{grid-template-columns:1fr}.cablebar{height:20px;width:8px;margin:auto}}
/* rack */
.rackwrap{position:relative;max-width:760px;margin:0 auto}
.rack{background:#1a1d22;border:8px solid #2c3038;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:12px}
.dev{background:linear-gradient(#3a3f47,#2a2e35);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dev .nm{color:#ddd;font-size:12px;font-weight:700;width:96px;flex:none}
.ports{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.port{width:46px;height:44px;background:#111;border:2px solid #555;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:9px;color:#aaa;position:relative;padding-bottom:2px}
.port::before{content:'';width:22px;height:16px;background:#000;border:1px solid #444;margin-bottom:3px}
.port.wan{border-color:#2f7de1}.port.sel{border-color:var(--accent);box-shadow:0 0 0 3px #22c3a666}
.port.used::before{background:#2b7fd6;border-color:#8cf}
.port .lk{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:50%;background:#333}
.port .lk.on{background:#4dff7a;box-shadow:0 0 6px #4dff7a}
.pwr{border:0;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;background:#552;color:#fd8}
.pwr.on{background:#1f5a32;color:#8f8}
.desk-ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.cables-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* ---------- POST / BIOS / setup ---------- */
.monitor{background:#111;border-radius:14px;padding:12px 12px 26px;box-shadow:0 10px 40px #000a;position:relative;height:100%;display:flex;flex-direction:column}
.monitor::after{content:'';position:absolute;bottom:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#2a2;box-shadow:0 0 6px #2f2}
.screen{flex:1;position:relative;overflow:hidden;background:#000;border-radius:4px;min-height:0}
.monwrap{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.kbd{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:none}
.kbd button{background:#222;border:1px solid #444;color:#ddd;border-radius:6px;padding:7px 10px;font-family:monospace;font-size:13px;min-width:44px}
.post{position:absolute;inset:0;color:#ddd;font-family:Consolas,monospace;font-size:clamp(11px,1.6vw,15px);padding:20px;white-space:pre-wrap}
.post .logo{font-size:clamp(28px,6vw,64px);font-weight:900;font-family:Arial,sans-serif;color:#e9e9e9;text-align:center;margin-top:12%;letter-spacing:.04em}
.post .logo small{display:block;font-size:30%;letter-spacing:.3em;color:#e33}
.post .bot{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bios{position:absolute;inset:0;background:#0b2d5c;color:#e6eefc;font-family:Consolas,monospace;font-size:clamp(11px,1.5vw,14px);display:flex;flex-direction:column}
.bios-h{background:#08214a;padding:8px 12px;display:flex;justify-content:space-between;color:#9fc3ff;flex-wrap:wrap;gap:6px}
.bios-tabs{display:flex;background:#123c78;overflow-x:auto}
.bios-tabs span{padding:6px 14px;cursor:pointer;white-space:nowrap}.bios-tabs span.on{background:#e6eefc;color:#0b2d5c;font-weight:700}
.bios-main{flex:1;display:flex;min-height:0}
.bios-list{flex:1;padding:10px 14px;overflow:auto}
.bios-row{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;cursor:pointer;border-radius:3px}
.bios-row.sel{background:#e6eefc;color:#0b2d5c}
.bios-row .v{color:#ffd76a}.bios-row.sel .v{color:#7a4b00;font-weight:700}
.bios-row.ro{cursor:default;opacity:.85}
.bios-help{width:32%;border-left:1px solid #2f5d9c;padding:10px;color:#9fc3ff;font-size:.9em}
.bios-foot{background:#08214a;padding:6px 12px;color:#9fc3ff;font-size:.85em}
.bios-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#123c78;border:2px solid #e6eefc;min-width:280px;max-width:92%;padding:10px}
.bios-pop h5{margin:0 0 8px;text-align:center;color:#ffd76a;font-size:1em}
.bios-pop div{padding:5px 8px;cursor:pointer}.bios-pop div.sel{background:#e6eefc;color:#0b2d5c}
@media(max-width:700px){.bios-help{display:none}}
.wsetup{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#3a1c71,#0b1f5c 60%,#062b6b);display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;padding:10px}
.wsbox{background:#f3f3f3;color:#222;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px #0008;font-size:13.5px}
.wsbox .ttl{background:#fff;padding:6px 10px;font-size:12px;border-bottom:1px solid #ddd;display:flex;gap:6px;align-items:center}
.wsbox .bd{padding:16px 20px}
.wsbox h3{font-weight:400;font-size:19px;margin:0 0 12px;color:#1a1a1a}
.wsbox .ft{padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #ddd}
.wsbox .ft button,.wsb{background:#e1e1e1;border:1px solid #adadad;padding:5px 18px;color:#111}
.wsbox label{display:block;margin:8px 0 3px}
.wsbox select,.wsbox input[type=text],.wsbox input[type=password]{width:100%;padding:5px;border:1px solid #888;background:#fff;color:#111}
.wslist{border:1px solid #aaa;background:#fff;max-height:220px;overflow:auto}
.wslist div{padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.wslist div.sel{background:#cce8ff}
.wslist .hd{background:#eee;cursor:default;font-weight:600}
.oobe{position:absolute;inset:0;background:#0b2a55;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:auto}
.oobe h2{font-weight:300;font-size:clamp(20px,3.5vw,32px);margin:0 0 16px}
.oobe .ol{background:#ffffff14;width:min(420px,100%);max-height:40vh;overflow:auto;text-align:left}
.oobe .ol div{padding:8px 12px;cursor:pointer}.oobe .ol div.sel{background:#0078d4}
.oobe input,.oobe select{width:min(380px,100%);padding:8px;margin:6px 0;border:0;border-bottom:2px solid #9cf;background:#fff;color:#111}
.oobe .ob{background:#0078d4;color:#fff;border:0;padding:8px 26px;margin:14px 6px 0}
.oobe .ob.s{background:#ffffff26}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid #ffffff22;border-top-color:#fff;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- simulated desktop ---------- */

/* ================= IP HELPERS ================= */
function validIP(s){return /^\d{1,3}(\.\d{1,3}){3}$/.test(s||'')&&s.split('.').every(x=>+x<=255)}
function ip2n(s){return s.split('.').reduce((a,o)=>a*256+(+o),0)}
function sameNet(a,b,m){if(!validIP(a)||!validIP(b)||!validIP(m))return false;return ((ip2n(a)&ip2n(m))>>>0)===((ip2n(b)&ip2n(m))>>>0)}
function validMask(m){if(!validIP(m))return false;const n=ip2n(m),inv=(~n)>>>0;return n!==0&&((inv&(inv+1))>>>0)===0}
function pwComplex(p){if(!p||p.length<8)return false;let c=0;if(/[a-z]/.test(p))c++;if(/[A-Z]/.test(p))c++;if(/\d/.test(p))c++;if(/[^A-Za-z0-9]/.test(p))c++;return c>=3}
/* ================= NETWORK SIMULATOR ================= */
const PUBLIC_DNS=['8.8.8.8','8.8.4.4','1.1.1.1','1.0.0.1'];
const DOMAINS={'google.com':'142.250.66.78','www.google.com':'142.250.66.68','facebook.com':'157.240.15.35','youtube.com':'142.250.71.14','tesda.gov.ph':'202.90.134.20'};
function fakeIP(t){let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;return `104.${h%200+10}.${(h>>8)%250}.${(h>>16)%250+1}`}
function mkNode(o){return Object.assign({hostname:'DESKTOP-7Q2M4KD',pendingName:null,domain:null,pendingDomain:null,workgroup:'WORKGROUP',nic:true,media:false,dhcp:true,dnsFixed:null,ip:'',mask:'',gw:'',dns1:'',dns2:'',apipa:false,icmp:false,discovery:false,fileShare:false,shares:{},fs:{'C:':[{n:'PerfLogs',d:1},{n:'Program Files',d:1},{n:'Program Files (x86)',d:1},{n:'Users',d:1},{n:'Windows',d:1}]},drives:[{l:'C:',name:'Local Disk',icon:'💽'}],mac:'00-1A-2B-3C-4D-5E',os:'win10',accounts:{},devices:[]},o)}
const nodesOf=L=>Object.values(L.nodes||{});
function findIP(L,ip){if(L.router&&L.router.up&&L.router.ip===ip)return {router:true,ip};return nodesOf(L).find(n=>n.media&&n.nic&&n.ip===ip&&!n.apipa)}
function lreach(L,n,ip,ignoreFw){
 if(!n.nic||!n.media)return 'fail';
 if(ip.startsWith('127.'))return 'ok';
 if(!validIP(n.ip)||n.ip==='0.0.0.0')return 'fail';
 if(ip===n.ip)return 'ok';
 if(n.apipa)return 'timeout';
 if(nodesOf(L).some(o=>o!==n&&o.media&&o.ip===n.ip))return 'timeout';
 if(sameNet(ip,n.ip,n.mask)){
  const t=findIP(L,ip);if(!t)return 'unreach';
  if(t.router)return n.rtReach===false?'unreach':sameNet(n.ip,ip,'255.255.255.0')?'ok':'timeout';
  if(n.seg&&t.seg&&n.seg!==t.seg)return 'unreach';
  if(!sameNet(n.ip,t.ip,t.mask))return 'timeout';
  return (t.icmp||ignoreFw)?'ok':'timeout';
 }
 if(!n.gw||!sameNet(n.gw,n.ip,n.mask))return 'fail';
 if(!L.router||!L.router.up||n.rtReach===false||n.gw!==L.router.ip||!sameNet(n.ip,L.router.ip,'255.255.255.0'))return 'unreach';
 return L.router.internet?'ok':'timeout';
}
function dcOf(L){return nodesOf(L).find(o=>o.isDC)}
function dnsServers(n){return [n.dns1,n.dns2].filter(validIP)}
function canDC(L,n){const dc=dcOf(L);if(!dc||!dc.media)return false;return dnsServers(n).some(s=>(s===dc.ip&&lreach(L,n,s,true)==='ok')||(n===dc&&s.startsWith('127.')))}
function publicDNS(L,n){return dnsServers(n).some(s=>{if(PUBLIC_DNS.includes(s))return lreach(L,n,s)==='ok';if(L.router&&s===L.router.ip)return lreach(L,n,s)==='ok'&&L.router.internet;const dc=dcOf(L);if(dc&&(s===dc.ip||(n===dc&&s.startsWith('127.'))))return canDC(L,n)&&L.router&&L.router.internet;return false})}
function resolveName(L,n,name){
 name=name.toLowerCase();if(name==='localhost')return '127.0.0.1';
 const short=name.split('.')[0],dc=dcOf(L);
 if(dc&&canDC(L,n)){if(name===dc.domain)return dc.ip;const t=nodesOf(L).find(o=>o.hostname.toLowerCase()===short&&(o.domain===dc.domain||o.isDC)&&o.media);if(t&&(name===short||name===short+'.'+dc.domain))return t.ip}
 if(!name.includes('.')){const t=nodesOf(L).find(o=>o.hostname.toLowerCase()===short&&o.media&&!o.apipa);if(t&&n.media&&!n.apipa&&sameNet(t.ip,n.ip,n.mask))return t.ip}
 if(/\.[a-z]{2,}$/.test(name)&&publicDNS(L,n))return DOMAINS[name]||fakeIP(name);
 return null;
}
function fixDns(n){if(n.dnsFixed){n.dns1=n.dnsFixed[0]||'';n.dns2=n.dnsFixed[1]||''}}
function dhcpRenew(L,n){
 if(!n.media)return false;
 const srv=nodesOf(L).find(o=>o.dhcpRole&&o.dhcpAuth&&o.scope&&o.scope.active&&o.media&&!o.dhcp);
 if(srv&&lreach(L,n,srv.ip,true)!=='fail'){const s=srv.scope,base=s.start.split('.').slice(0,3).join('.'),st=+s.start.split('.')[3];
  let i=st;while(nodesOf(L).some(o=>o!==n&&o.ip===base+'.'+i))i++;
  Object.assign(n,{ip:base+'.'+i,mask:s.mask,gw:s.router||'',dns1:s.dns||'',dns2:'',apipa:false,lease:srv.hostname});fixDns(n);return true}
 if(L.router&&L.router.up&&n.rtReach!==false&&L.router.dhcp&&L.router.dhcp.on){const r=L.router,base=r.ip.split('.').slice(0,3).join('.'),st=+r.dhcp.start.split('.')[3];
  let i=st;while(nodesOf(L).some(o=>o!==n&&o.ip===base+'.'+i))i++;
  Object.assign(n,{ip:base+'.'+i,mask:'255.255.255.0',gw:r.ip,dns1:r.ip,dns2:'',apipa:false,lease:'router'});fixDns(n);return true}
 Object.assign(n,{ip:'169.254.'+(10+Math.floor(Math.random()*200))+'.'+(2+Math.floor(Math.random()*250)),mask:'255.255.0.0',gw:'',dns1:'',dns2:'',apipa:true});return false;
}
function simPing(L,n,target){
 if(!target)return {lines:['','Usage: ping target_name   (example: ping 192.168.1.1)']};
 let ip=target,name=null;
 if(!validIP(target)){ip=resolveName(L,n,target);if(!ip)return {lines:['',`Ping request could not find host ${target}. Please check the name and try again.`],ok:false,target};name=target}
 const r=lreach(L,n,ip);
 const L2=['',name?`Pinging ${name} [${ip}] with 32 bytes of data:`:`Pinging ${ip} with 32 bytes of data:`];
 let rec=0;const times=[];const lan=(L.router&&sameNet(ip,L.router.ip,'255.255.255.0'))||ip.startsWith('127.')||ip===n.ip;
 for(let k=0;k<4;k++){
  if(r==='ok'){const t=lan?(Math.random()<.7?0:1+Math.floor(Math.random()*3)):18+Math.floor(Math.random()*25);times.push(t);const ttl=L.router&&ip===L.router.ip?64:lan?128:115;L2.push(`Reply from ${ip}: bytes=32 time${t===0?'<1':'='+t}ms TTL=${ttl}`);rec++}
  else if(r==='timeout')L2.push('Request timed out.');
  else if(r==='unreach'){L2.push(`Reply from ${n.ip}: Destination host unreachable.`);rec++}
  else L2.push('PING: transmit failed. General failure.');
 }
 L2.push('',`Ping statistics for ${ip}:`,`    Packets: Sent = 4, Received = ${rec}, Lost = ${4-rec} (${Math.round((4-rec)/4*100)}% loss),`);
 if(times.length){const mn=Math.min(...times),mx=Math.max(...times),av=Math.round(times.reduce((a,b)=>a+b,0)/times.length);L2.push('Approximate round trip times in milli-seconds:',`    Minimum = ${mn}ms, Maximum = ${mx}ms, Average = ${av}ms`)}
 return {lines:L2,ok:r==='ok',ip,name,target,slow:r==='timeout'};
}
function ipconfigOut(n,all){
 const L=['','Windows IP Configuration',''];
 if(all)L.push('   Host Name . . . . . . . . . . . . : '+n.hostname,'   Primary Dns Suffix  . . . . . . . : '+(n.domain||''),'   Node Type . . . . . . . . . . . . : Hybrid','   IP Routing Enabled. . . . . . . . : No','');
 if(!n.nic)return L;
 L.push('Ethernet adapter Ethernet:','');
 const desc=['   Description . . . . . . . . . . . : Realtek PCIe GbE Family Controller','   Physical Address. . . . . . . . . : '+n.mac,'   DHCP Enabled. . . . . . . . . . . : '+(n.dhcp?'Yes':'No')];
 if(!n.media){L.push('   Media State . . . . . . . . . . . : Media disconnected','   Connection-specific DNS Suffix  . : ');if(all)L.push(...desc);return L}
 L.push('   Connection-specific DNS Suffix  . : '+(n.domain||''));
 if(all)L.push(...desc,'   Autoconfiguration Enabled . . . . : Yes');
 L.push('   Link-local IPv6 Address . . . . . : fe80::1c4a:9b2e:7d10:5a3c%12'+(all?'(Preferred)':''));
 if(n.apipa)L.push('   Autoconfiguration IPv4 Address. . : '+n.ip+(all?'(Preferred)':''));
 else if(n.ip&&n.ip!=='0.0.0.0')L.push('   IPv4 Address. . . . . . . . . . . : '+n.ip+(all?'(Preferred)':''));
 L.push('   Subnet Mask . . . . . . . . . . . : '+(n.mask||'0.0.0.0'));
 if(all&&n.dhcp&&!n.apipa&&n.ip&&n.ip!=='0.0.0.0')L.push('   DHCP Server . . . . . . . . . . . : '+(n.lease==='router'?'(router)':n.lease||''));
 L.push('   Default Gateway . . . . . . . . . : '+(n.gw||''));
 if(all){const d=dnsServers(n);L.push('   DNS Servers . . . . . . . . . . . : '+(d[0]||''));d.slice(1).forEach(x=>L.push('                                       '+x));L.push('   NetBIOS over Tcpip. . . . . . . . : Enabled')}
 return L;
}
const HELP=['Commands available in this simulator:','  ipconfig  [/all | /release | /renew | /flushdns]','  ping <ip or name>      Test connectivity','  nslookup <name>        Test DNS name resolution','  hostname               Show the computer name','  whoami                 Show the signed-in user','  getmac                 Show the MAC address','  net view \\\\<computer>  Show shared folders on a computer','  net share              Show folders shared on this PC','  shutdown /r /t 0       Restart this computer','  cls  |  exit'];
async function execCmd(L,n,c,print,hooks){
 const lc=c.toLowerCase().trim(),parts=lc.split(/\s+/),cmd=parts[0];
 if(!lc)return;
 const notState=()=>{print('');print('The operation failed as no adapter is in the state permissible for');print('this operation.')};
 const noMedia=()=>{print('');print('No operation can be performed on Ethernet while it has its media disconnected.')};
 switch(cmd){
  case 'cls':return 'cls';
  case 'exit':hooks.close&&hooks.close();return;
  case 'help':HELP.forEach(l=>print(l));return;
  case 'hostname':print(n.hostname);return;
  case 'whoami':print((hooks.user?hooks.user():'user').toLowerCase());return;
  case 'getmac':print('');print('Physical Address    Transport Name');print('=================== ==========================================================');print(n.nic?n.mac+'   '+(n.media?'\\Device\\Tcpip_{4D36E972-E325-11CE-BFC1-08002BE10318}':'Media disconnected'):'N/A                 Hardware not present');return;
  case 'shutdown':if(lc.includes('/r')){print('');print('Restarting...');await sleep(600);hooks.restart&&hooks.restart()}else print('Usage: shutdown /r /t 0');return;
  case 'ipconfig':
   if(parts[1]==='/release'){if(!n.nic)return print('No adapters are in the state permissible for this operation.');if(!n.dhcp)return notState();if(!n.media)return noMedia();Object.assign(n,{ip:'0.0.0.0',mask:'0.0.0.0',gw:'',apipa:false});ipconfigOut(n,false).forEach(print);hooks.changed&&hooks.changed();return}
   if(parts[1]==='/renew'){if(!n.nic)return print('No adapters are in the state permissible for this operation.');if(!n.dhcp)return notState();if(!n.media)return noMedia();print('');print('Windows IP Configuration');await sleep(1200);
    if(dhcpRenew(L,n))ipconfigOut(n,false).slice(3).forEach(print);
    else{await sleep(1500);print('');print('An error occurred while renewing interface Ethernet : unable to contact');print('your DHCP server. Request has timed out.')}
    hooks.changed&&hooks.changed();return}
   if(parts[1]==='/flushdns'){print('');print('Windows IP Configuration');print('');print('Successfully flushed the DNS Resolver Cache.');return}
   ipconfigOut(n,parts[1]==='/all').forEach(print);return;
  case 'ping':{const r=simPing(L,n,c.trim().split(/\s+/)[1]);for(const l of r.lines){print(l);await sleep(/^(Reply|Request|PING:)/.test(l)?(r.slow?900:300):30)}hooks.onPing&&hooks.onPing(r);return}
  case 'nslookup':{const t=parts[1];if(!t)return print('Usage: nslookup <name>');const srv=dnsServers(n)[0];
   if(!n.media||!srv){print('*** Default servers are not available');print('Server:  UnKnown');print('Address:  127.0.0.1');print('');print(`*** UnKnown can't find ${t}: No response from server`);return}
   const ip=resolveName(L,n,t.includes('.')||!dcOf(L)?t:t+'.'+dcOf(L).domain);const dc=dcOf(L);const sn=dc&&(srv===dc.ip||srv.startsWith('127.'))?dc.hostname.toLowerCase()+'.'+dc.domain:srv.startsWith('8.8.')?'dns.google':'UnKnown';
   if(ip){await sleep(300);print('Server:  '+sn);print('Address:  '+srv);print('');if(!(dc&&ip===dc.ip))print('Non-authoritative answer:');print('Name:    '+t);print('Address:  '+ip)}
   else{await sleep(1800);print('DNS request timed out.');print('    timeout was 2 seconds.');print('Server:  UnKnown');print('Address:  '+srv);print('');print(`*** UnKnown can't find ${t}: Non-existent domain`)}return}
  case 'net':
   if(parts[1]==='share'){print('');print('Share name   Resource                        Remark');print('-------------------------------------------------------------------------------');print('C$           C:\\                             Default share');print('IPC$                                         Remote IPC');Object.entries(n.shares).forEach(([k,v])=>print(k.padEnd(13)+v.path));print('The command completed successfully.');return}
   if(parts[1]==='view'){const tgt=(c.trim().split(/\s+/)[2]||'').replace(/^\\\\/,'');if(!tgt){print('Server Name            Remark');print('');print('-------------------------------------------------------------------------------');nodesOf(L).filter(o=>o.media&&o.discovery&&!o.apipa&&sameNet(o.ip,n.ip,n.mask)).forEach(o=>print('\\\\'+o.hostname));print('The command completed successfully.');return}
    const ip=validIP(tgt)?tgt:resolveName(L,n,tgt);const t=ip&&nodesOf(L).find(o=>o.ip===ip);
    if(!t||lreach(L,n,ip,true)!=='ok'||!t.fileShare){await sleep(1500);print('System error 53 has occurred.');print('');print('The network path was not found.');return}
    print('Shared resources at \\\\'+tgt);print('');print('Share name  Type  Used as  Comment');print('-------------------------------------------------------------------------------');Object.keys(t.shares).forEach(s=>print(s.padEnd(12)+'Disk'));print('The command completed successfully.');return}
   print('The syntax of this command is:');print('NET [ SHARE | VIEW ]');return;
  default:print(`'${c.trim().split(' ')[0]}' is not recognized as an internal or external command,`);print('operable program or batch file.');
 }
}
function makeTerm(host,L,n,hooks={}){
 host.innerHTML=`<div class="term"><div class="term-out"></div><form class="term-in"><span>C:\\Users\\${esc((hooks.user?hooks.user():'user').split('\\').pop())}&gt;</span><input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command"></form></div><div class="term-chips">${['ipconfig','ipconfig /all','ping ','nslookup ','ipconfig /renew','hostname','cls','help'].map(c=>`<button type="button" data-c="${c}">${c.trim()}</button>`).join('')}</div>`;
 const out=$('.term-out',host),form=$('form',host),inp=$('input',host),prompt=$('.term-in span',host).textContent;
 const hist=[];let hi=0,busy=false;
 const print=(t,cls='')=>{const d=document.createElement('div');if(cls)d.className=cls;d.textContent=t===''?' ':t;out.appendChild(d);out.scrollTop=out.scrollHeight};
 print(n.os==='server'?'Microsoft Windows [Version 10.0.17763.6532]':'Microsoft Windows [Version 10.0.19045.5131]');print('(c) Microsoft Corporation. All rights reserved.');print('');print('Type "help" for the list of commands in this simulator.','dim');print('');
 out.addEventListener('click',()=>{if(!window.getSelection().toString())inp.focus()});
 $$('.term-chips button',host).forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c.endsWith(' ')){inp.value=c;inp.focus()}else run(c)});
 inp.addEventListener('keydown',ev=>{if(ev.key==='ArrowUp'){if(hi>0){hi--;inp.value=hist[hi]}ev.preventDefault()}else if(ev.key==='ArrowDown'){if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}ev.preventDefault()}});
 form.onsubmit=ev=>{ev.preventDefault();if(busy)return;const c=inp.value;inp.value='';run(c)};
 async function run(c){if(busy)return;busy=true;print(prompt+c,'cmd');if(c.trim()){hist.push(c);hi=hist.length}
  const res=await execCmd(L,n,c,print,hooks);if(res==='cls')out.innerHTML='';else print('');busy=false;hooks.onCmd&&hooks.onCmd(c)}
 setTimeout(()=>{if(matchMedia('(pointer:fine)').matches)inp.focus()},50);
 return {print,run};
}

 rjb.pos=[-22,0,-19];rjb.id='rj';P.rj=rjb;

function initWorld(){
 W.cv=$('#cv');W.ctx=W.cv.getContext('2d');
 addEventListener('resize',resize);
 addEventListener('keydown',e=>{if(G.inTask||!$('#modal').classList.contains('hidden')||$('#world').classList.contains('hidden'))return;
  const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){W.keys[k]=true;W.target=null;e.preventDefault()}
  if(k==='e'||k==='enter'||k===' '){interact();e.preventDefault()}});
 addEventListener('keyup',e=>{W.keys[e.key.toLowerCase()]=false});
 W.cv.addEventListener('pointerdown',e=>{const r=W.cv.getBoundingClientRect(),x=(e.clientX-r.left-W.ox)/W.s,y=(e.clientY-r.top-W.oy)/W.s;
  const o=W.room.objs.find(o=>(o.tasks||o.npc||o.exit)&&x>=o.x-6&&x<=o.x+o.w+6&&y>=o.y-40&&y<=o.y+o.h+6);
  if(o){W.target={x:Math.min(Math.max(o.x+o.w/2,30),930),y:o.exit?o.y+o.h/2:o.y+o.h+22};W.useOnArrive=o}else{W.target={x,y};W.useOnArrive=null}});
 const joy=$('#joy'),knob=$('#joy i');let jid=null;
 const jm=e=>{const t=[...e.changedTouches].find(t=>t.identifier===jid);if(!t)return;const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);const d=Math.hypot(dx,dy);if(d>45){dx*=45/d;dy*=45/d}W.joy={x:dx/45,y:dy/45};knob.style.transform=`translate(${dx}px,${dy}px)`;W.target=null;e.preventDefault()};
 joy.addEventListener('touchstart',e=>{jid=e.changedTouches[0].identifier;jm(e)},{passive:false});
 joy.addEventListener('touchmove',jm,{passive:false});

}
function resize(){if(!W.cv)return;const d=devicePixelRatio||1;W.cv.width=innerWidth*d;W.cv.height=innerHeight*d;W.dpr=d}
function solids(){return W.room.objs.filter(o=>o.solid!==false&&!o.wall)}
function blocked(x,y){if(x<26||x>934||y<WALL+14||y>RH-14)return true;return solids().some(o=>x>o.x-12&&x<o.x+o.w+12&&y>o.y-4&&y<o.y+o.h+10)}
function rectDist(o,x,y){const dx=Math.max(o.x-x,0,x-(o.x+o.w)),dy=Math.max(o.y-y,0,y-(o.y+o.h));return Math.hypot(dx,dy)}
function loop(ts){
 if(!W.running)return;const dt=Math.min(.05,(ts-(W.lt||ts))/1000);W.lt=ts;W.t+=dt;
 if(!G.inTask&&$('#modal').classList.contains('hidden'))step(dt);

}
function step(dt){
 const p=W.p,k=W.keys;let vx=(k.arrowright||k.d?1:0)-(k.arrowleft||k.a?1:0),vy=(k.arrowdown||k.s?1:0)-(k.arrowup||k.w?1:0);
 if(W.joy.x||W.joy.y){vx=W.joy.x;vy=W.joy.y}
 if(!vx&&!vy&&W.target){const dx=W.target.x-p.x,dy=W.target.y-p.y,d=Math.hypot(dx,dy);if(d<6){W.target=null;if(W.useOnArrive){const o=W.useOnArrive;W.useOnArrive=null;if(rectDist(o,p.x,p.y)<60)useObj(o)}}else{vx=dx/d;vy=dy/d}}
 const m=Math.hypot(vx,vy);p.moving=m>0.1;
 if(p.moving){if(m>1){vx/=m;vy/=m}const sp=210*dt;const ox=p.x,oy=p.y;
  if(!blocked(p.x+vx*sp,p.y))p.x+=vx*sp;if(!blocked(p.x,p.y+vy*sp))p.y+=vy*sp;
  if(Math.abs(vx)>Math.abs(vy))p.dir=vx>0?2:3;else p.dir=vy>0?1:0;p.anim+=dt*10;
  if(W.target&&Math.hypot(p.x-ox,p.y-oy)<0.3){W.stuck+=dt;if(W.stuck>.4){W.stuck=0;const o=W.useOnArrive;W.target=null;W.useOnArrive=null;if(o&&rectDist(o,p.x,p.y)<60)useObj(o)}}else W.stuck=0}
 let best=null,bd=56;W.room.objs.forEach(o=>{if(!(o.tasks||o.npc||o.exit))return;const d=rectDist(o,p.x,p.y);if(d<bd){bd=d;best=o}});W.near=best;
 const pr=$('#prompt');if(best){pr.classList.remove('hidden');pr.innerHTML=`<kbd>E</kbd>${best.npc?'Talk to the assessor':best.exit?'Exit room':'Use '+esc(best.label)}${best.tasks&&stationTask(best)===null&&!best.tasks.every(t=>G.prog[t])?' 🔒':''}`;$('#useBtn').disabled=false}else{pr.classList.add('hidden');$('#useBtn').disabled=true}
}
function stationTask(o){const nt=nextTask(G.coc);return o.tasks&&o.tasks.includes(nt)?nt:null}

let CTX=null;
function openTask(id){
 const T=TASKS[id],L=lab(T.coc),R=G.rs[id]||(G.rs[id]={pen:0,log:[],done:{},hints:{},flags:{}});
 G.inTask=true;W.keys={};W.target=null;W.joy={x:0,y:0};
 const ov=$('#taskov');ov.classList.remove('hidden');
 ov.innerHTML=`<div class="tk-top"><button id="tkBack">← Step away</button><div class="tt">${T.title} <small>· COC ${T.coc} · ${T.where}</small></div><button id="tkSheetB">📋 Task Sheet</button></div><div class="tk-main"><div class="tk-body" id="tkBody"></div><aside class="tk-sheet${innerWidth<=900?' closed':''}" id="tkSheet"></aside></div>`;
 const ctx=CTX={T,L,R,body:$('#tkBody'),cleanup:[],finished:false,
  penalty(p,msg){R.pen+=p;R.log.push(['bad',msg+(p?` (−${p})`:'')]);toast('✖ '+msg+(p?` <b>(−${p})</b>`:''),'bad');renderSheet();save()},
  good(msg){if(!R.log.some(l=>l[1]===msg))R.log.push(['good',msg])},
  flag(k,v=true){R.flags[k]=v;ctx.check()},
  check(){if(ctx.finished)return;let ch=false;T.objectives.forEach(o=>{if(!R.done[o.id]&&o.check(L,R.flags,ctx)){R.done[o.id]=true;ch=true;toast('✔ '+o.text,'good')}});
   if(ch)renderSheet();save();
   if(T.objectives.every(o=>R.done[o.id])){ctx.finished=true;setTimeout(()=>completeTask(id),900)}},
  every(fn,ms){const h=setInterval(fn,ms);ctx.cleanup.push(()=>clearInterval(h));return h},
  later(fn,ms){const h=setTimeout(fn,ms);ctx.cleanup.push(()=>clearTimeout(h));return h}};
 $('#tkBack').onclick=()=>closeTask();
 $('#tkSheetB').onclick=()=>$('#tkSheet').classList.toggle('closed');
 renderSheet();T.start(ctx);ctx.check();
}
function renderSheet(){
 const ctx=CTX;if(!ctx)return;const {T,R}=ctx,sh=$('#tkSheet');if(!sh)return;
 sh.innerHTML=`<h4>📋 Task Sheet</h4><div class="sub">COC ${T.coc} · Task ${COCS[T.coc].tasks.indexOf(T.id)+1}: ${T.title}</div>${T.info?`<div class="info">${T.info}</div>`:''}
 ${T.objectives.map(o=>`<div class="obj ${R.done[o.id]?'ok':''}"><span class="ck">${R.done[o.id]?'✓':''}</span><span>${o.text}${R.hints[o.id]?`<span class="hint">💡 ${o.hint}</span>`:''}</span>${!R.done[o.id]&&!R.hints[o.id]&&o.hint?`<button class="hb" onclick="useHint('${o.id}')">Hint −3</button>`:''}</div>`).join('')}
 <div class="tk-score">Deductions so far: <b>−${R.pen}</b></div>`;
}
function useHint(oid){const ctx=CTX;ctx.R.hints[oid]=true;ctx.R.pen+=3;ctx.R.log.push(['bad',`Used a hint: "${ctx.T.objectives.find(o=>o.id===oid).text}" (−3)`]);renderSheet();save()}
function closeTask(){
 if(CTX){CTX.cleanup.forEach(f=>{try{f()}catch(e){}});if(CTX.T.stop)CTX.T.stop(CTX)}
 CTX=null;G.inTask=false;$('#taskov').classList.add('hidden');$('#taskov').innerHTML='';save();updHud();
}
function completeTask(id){
 const ctx=CTX;if(!ctx||ctx.T.id!==id)return;const R=ctx.R;const score=Math.max(0,100-R.pen);
 G.prog[id]={score};save();
 const b=el(`<div class="done-banner"><div class="modal-box"><div class="result ${score>=80?'pass':'fail'}"><p class="muted" style="margin:0">Task complete</p><div class="big">${score}</div><h3>${TASKS[id].title}</h3>

 $('#taskov').appendChild(b);$('#tkDone').onclick=()=>{closeTask();if(cocDone(G.coc))setTimeout(showCocResult,300)};
}

   if(pc==='Activate Scope')b=`<h3 style="font-weight:300">Activate Scope</h3><p>Clients can obtain address leases only if a scope is activated.</p><p>Do you want to activate this scope now?</p><label class="radio"><input type="radio" name="ac" value="1" ${s.act?'checked':''}> Yes, I want to activate this scope now</label><label class="radio"><input type="radio" name="ac" value="0" ${s.act?'':'checked'}> No, I will activate this scope later</label>`;
   if(pc==='Completing')b=`<h3 style="font-weight:300">Completing the New Scope Wizard</h3><p>You have successfully completed the New Scope wizard.</p><p>To close this wizard, click Finish.</p>`;
   dw.body.innerHTML=`<div class="dp" style="min-height:280px">${b}</div><div class="dbtns"><button class="wb" id="nsB" ${pg===0?'disabled':''}>&lt; Back</button><button class="wb pri" id="nsN">${pc==='Completing'?'Finish':'Next &gt;'}</button><button class="wb" id="nsC">Cancel</button></div>`;
   const q=x=>$(x,dw.body);
   if(q('#sL')){q('#sL').oninput=()=>{const l=+q('#sL').value;if(l>=8&&l<=30){const m=(0xFFFFFFFF<<(32-l))>>>0;q('#sM').value=[24,16,8,0].map(b=>(m>>>b)&255).join('.')}};q('#sS').onblur=()=>{if(!q('#sE').value&&validIP(q('#sS').value)){}}}

    pg++;if(pc==='Configure DHCP Options'&&!s.opt)pg=10;r()};

 render();w.sub(render);

TASKS.c2_crimp={id:'c2_crimp',coc:2,title:'Make and test 2 straight-through cables',where:'Crimping Table',
 info:'Make 2 straight-through Cat6 patch cables (T568B on both ends, with boots).\n\n• Tap a tool on the pegboard or bench to pick it up, then tap the cable to use it.\n• The crimper has several blades and dies. Choose the right one!\n• Drag along each twisted pair to untwist it. Drag wires sideways to arrange them (left = pin 1, clip facing down).\n• Drag the RJ45 down onto the wires.\n\nNobody tells you if a step is wrong. The LAN tester will!',
 objectives:[{id:'c1',text:'Cable 1 (PC-01) passes the LAN tester and inspection',hint:'T568B: W/O, O, W/G, Bl, W/Bl, G, W/Br, Br. Trim to about 13 mm. Clip facing DOWN. Push the plug all the way. Squeeze the crimper until it clicks.',check:L=>L.made>=1},
  {id:'c2',text:'Cable 2 (PC-02) passes the LAN tester and inspection',hint:'If an LED never lights, that wire is open. If the numbers do not match, the order is wrong. Cut off the bad end and redo it.',check:L=>L.made>=2}],
 start(ctx){
  const L=ctx.L,f=ctx.R.flags;
  const newEnd=st=>({st,boot:false,strip:0,tw:[TW,TW,TW,TW],order:NATURAL.slice(),L:0,plug:null,crimp:'none'});
  let K=f.k3||(f.k3={held:null,coil:false,view:'A',A:newEnd(null),B:newEnd('cut')});
  let ui={mode:null,y:0,drag:null,finger:null};const t0=Date.now()-(f.el||0);
  const both=()=>K.A.st==='crimped'&&K.B.st==='crimped',cur=()=>K[K.view==='test'?'A':K.view];
  const hname=()=>K.held==='tester'?'LAN tester':K.held?TOOLS[K.held].name:'';
  const minor=(m,p=1)=>{if((f.mn=(f.mn||0)+1)<=10)ctx.penalty(p,m);else toast('✖ '+m,'bad')};
  ctx.every(()=>{const t=$('#fpT',ctx.body);f.el=Date.now()-t0;if(t)t.textContent=fmtTime(f.el)},1000);
  function render(){
   if(L.made>=2){ctx.body.innerHTML='<div class="stage"><div class="panel"><h3>✔ Both cables are done.</h3></div></div>';return}
   const E=cur(),tab=(v,l,dis)=>`<button class="${K.view===v?'on':''}" data-v="${v}" ${dis?'disabled':''}>${l}</button>`,cs=STEPS.find(s=>!stepDone(E,s[0]));
   ctx.body.innerHTML=`<div class="fpwrap"><div class="fp" id="fp"><svg viewBox="0 0 1600 900" id="cu" style="touch-action:none">${sceneInner(K,ui)}</svg>
    <div class="fp-task"><span class="ic">!</span><div><b>TASK:</b> Make straight-through cable ${L.made+1} of 2<br><span class="small">${K.view==='test'?'Test the cable with the LAN tester':'Working on: <b>End '+K.view+'</b>'}</span><br><span class="small">Progress: <b style="color:#f5c518">${L.made} / 2</b></span></div></div>
    ${K.view==='test'?'':`<div class="fp-steps">${STEPS.map((s,i)=>`<div class="${stepDone(E,s[0])?'ok':cs===s?'cur':''}"><span class="n">${i+1}</span>${s[1]}${stepDone(E,s[0])?' <span class="ck">✔</span>':''}</div>`).join('')}</div>`}
    <div class="fp-tr"><div class="fp-time">⏱ <span id="fpT">${fmtTime(f.el||0)}</span></div><div class="fp-tabs">${tab('A','End A')}${tab('B','End B',!K.A.st||K.A.st==='reel')}${tab('test','🧪 Test',!both())}</div><div class="fp-tabs"><button id="nx">💡 Next? (−1)</button><button id="help">📖 Tester</button></div></div>
    ${K.view==='test'?'':`<div class="fp-inset">${frontInset(E)}<b>FRONT VIEW</b></div>`}
    <div class="fp-bot" id="ctl"></div>${K.view==='test'?'<div class="fp-test" id="tst"></div>':''}</div></div>`;
   $$('[data-v]',ctx.body).forEach(b=>b.onclick=()=>{ui={mode:null,drag:null};K.view=b.dataset.v;render()});
   $('#nx',ctx.body).onclick=nextHint;$('#help',ctx.body).onclick=helpTester;
   bindDrag();ctl();if(K.view==='test')testerUI();
  }
  const redraw=()=>{const cu=$('#cu',ctx.body);if(cu)cu.innerHTML=sceneInner(K,ui);const ins=$('.fp-inset',ctx.body);if(ins)ins.innerHTML=frontInset(cur())+'<b>FRONT VIEW</b>'};
  const mouse=t=>`<span class="ms">🖱️</span>${t}`;
  function ctl(){const E=cur(),c=$('#ctl',ctx.body);let h='';
   if(ui.mode==='strip')h=`<button class="btn" id="go">✂ Strip here (${Math.round((ui.y-TOP)/MM)} mm)</button><button class="btn ghost" id="cn">Cancel</button><span class="small">${mouse('Drag on the cable to choose how much jacket to remove')}</span>`;
   else if(ui.mode==='trim')h=`<button class="btn" id="go">✂ Cut here (${Math.round((edgeY(E)-ui.y)/MM)} mm)</button><button class="btn ghost" id="cn">Cancel</button><span class="small">${mouse('Drag to place the cut line')}</span>`;
   else if(ui.mode==='squeeze')h=`<button class="btn" id="sq" style="touch-action:none">✊ Hold to squeeze</button><div class="sqbar"><i id="sqb"></i></div><button class="btn ghost" id="cn">Cancel</button>`;
   else if(K.view==='test')h='';
   else if(E.st==='stripped')h=mouse('Hold and drag up & down along a pair to untwist it');
   else if(E.st==='untwisted')h=mouse('Hold and drag the wires left or right to arrange them');
   else if(E.plug&&E.st!=='crimped')h=`${E.st==='trimmed'?'<button class="btn ghost sm" id="flip">🔄 Flip the plug</button>':''}${mouse('Drag the plug down onto the wires')}${E.st==='inserted'?'<button class="btn ghost sm" id="pull">Pull it off</button>':''}`;
   else h=mouse(K.held?`Tap the cable to use the ${hname().toLowerCase()}`:'Tap a tool or bin to pick it up');
   if(K.held&&!ui.mode)h+=`<button class="btn ghost sm" id="put">Put back ${esc(hname())}</button>`;
   c.innerHTML=h;const q=x=>$(x,c);if(q('#cn'))q('#cn').onclick=()=>{ui.mode=null;render()};
   if(q('#flip'))q('#flip').onclick=()=>{E.plug.flip=!E.plug.flip;redraw();ctl()};
   if(q('#pull'))q('#pull').onclick=()=>{E.plug.f=E.L+26;E.st='trimmed';render()};
   if(q('#go'))q('#go').onclick=()=>{if(ui.mode==='strip')doStrip();else doTrim()};
   if(q('#put'))q('#put').onclick=()=>{K.held=null;render()};
   if(q('#sq'))bindSqueeze(q('#sq'));
  }
  const svgPt=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform($('#cu',ctx.body).getScreenCTM().inverse());
  function bindDrag(){const cu=$('#cu',ctx.body);let d=null;
   cu.onpointerdown=e=>{const E=cur(),p=svgPt(e),t=e.target,pkg=t.closest&&t.closest('.pk');d={x0:p.x,y0:p.y,moved:0,lastY:p.y,lastX:p.x};
    if(pkg){d.kind='pick';d.id=pkg.dataset.id}
    else if(K.view==='test'){d.kind='none'}
    else if(ui.mode==='strip'||ui.mode==='trim'){d.kind='marker';setMarker(p.y)}
    else if(t.classList.contains('pair')){d.kind='pair';d.p=+t.dataset.p;d.acc=0;ui.finger=p}
    else if(t.classList.contains('wire')){d.kind='wire';ui.drag=+t.dataset.i;ui.finger=p}
    else if(t.closest&&t.closest('.plug')&&E.st!=='crimped'){d.kind='plug';d.f0=E.plug.f}
    cu.setPointerCapture(e.pointerId);redraw()};
   cu.onpointermove=e=>{if(!d)return;const E=cur(),p=svgPt(e);d.moved+=Math.abs(p.x-d.lastX)+Math.abs(p.y-d.lastY);
    if(d.kind==='marker')setMarker(p.y);
    if(d.kind==='pair'){ui.finger=p;if(E.tw[d.p]>0){d.acc+=Math.abs(p.y-d.lastY)+Math.abs(p.x-d.lastX);if(d.acc>60){d.acc=0;E.tw[d.p]--;if(!E.tw[d.p])toast(`${['Orange','Green','Blue','Brown'][d.p]} pair untwisted.`);if(E.tw.every(x=>!x)){E.st='untwisted';E.order=NATURAL.slice();d=null;ui.finger=null;render();return}}}redraw()}
    if(d.kind==='wire'){ui.finger=p;const j=Math.max(0,Math.min(7,Math.round((p.x-slotX(0))/18)));if(j!==ui.drag){const k=E.order.splice(ui.drag,1)[0];E.order.splice(j,0,k);ui.drag=j}redraw()}
    if(d.kind==='plug'){const fmin=Math.max(E.L,11),nf=Math.max(fmin,Math.min(E.L+30,d.f0-(p.y-d.y0)/MM));E.plug.f=Math.round(nf*4)/4;redraw()}
    d.lastX=p.x;d.lastY=p.y};
   cu.onpointerup=()=>{if(!d)return;const E=cur(),k=d.kind,mv=d.moved,id=d.id;d=null;ui.finger=null;
    if(k==='pick'){if(mv<12)pick(id);return}
    if(k==='wire'){ui.drag=null;redraw();return}
    if(k==='pair'){redraw();if(mv<8)apply();return}
    if(k==='plug'){const was=E.st;E.st=E.plug.f<=E.L+21?'inserted':'trimmed';if(was!==E.st)render();else redraw();return}
    if(k==='marker'){ctl();return}
    if(mv<8&&K.view!=='test')apply()}}
  function setMarker(y){const E=cur();if(ui.mode==='strip')ui.y=Math.max(TOP+5*MM,Math.min(TOP+55*MM,y));else ui.y=Math.max(tipY(E)+MM,Math.min(edgeY(E)-5*MM,y));redraw();const b=$('#go',ctx.body);if(b)b.textContent=ui.mode==='strip'?`✂ Strip here (${Math.round((ui.y-TOP)/MM)} mm)`:`✂ Cut here (${Math.round((edgeY(E)-ui.y)/MM)} mm)`}
  function doStrip(){const E=cur(),mm=Math.round((ui.y-TOP)/MM);ui.mode=null;if(mm<18){toast(`Only ${mm} mm of wire is exposed. Too short to untwist and arrange. Strip more of the jacket.`,'bad');return render()}
   E.strip=mm;E.st='stripped';E.tw=[TW,TW,TW,TW];toast(`Removed ${mm} mm of jacket.`);render()}
  function doTrim(){const E=cur(),mm=Math.round((edgeY(E)-ui.y)/MM);ui.mode=null;E.L=mm;E.st='trimmed';toast(`Wires trimmed to ${mm} mm.`);render()}
  function bindSqueeze(b){let h=null,p=0;const bar=$('#sqb',ctx.body);
   const down=e=>{e.preventDefault();if(h)return;h=setInterval(()=>{p=Math.min(100,p+4);bar.style.width=p+'%';if(p>=100){clearInterval(h);h=null;bar.style.background='var(--good)';finish()}},50)};
   const up=()=>{if(!h)return;clearInterval(h);h=null;finish()};
   const finish=()=>{if(ui.mode!=='squeeze')return;const E=cur();ui.mode=null;
    if(p>=100){E.crimp='full';toast('🗜️ <i>Click!</i> The ratchet released.')}else if(p>=30){if(E.crimp!=='full')E.crimp='half';toast('The handles sprang open.')}else toast('You barely pressed the handles.');
    if(p>=30&&E.st==='inserted'){E.st='crimped';if(K.view==='A'&&K.B.st!=='crimped'){K.view='B';setTimeout(()=>toast('Now do End B.'),1200)}else if(both())K.view='test'}render()};
   b.onpointerdown=down;['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,up))}
  function pick(id){
   if(id==='coil'){if(!K.coil){K.coil=true;K.A.st='reel';K.view='A';toast('You pulled the cable from the coil.')}else toast('The cable is already out.');return render()}
   const t=id==='master'||id==='remote'?'tester':id;if(K.held===t){K.held=null;return render()}K.held=t;render()}
  async function apply(){
   const t=K.held,E=cur();if(!t)return toast('Pick up a tool first (pegboard, bins or bench).');
   if(t==='punch')return minor('The punch-down tool is for keystone jacks and patch panels, not RJ45 plugs',2);
   if(t==='ties')return toast('Cable ties are for tidying cables later.');
   if(t==='scissors')return minor('Scissors crush the wires and leave an uneven cut. Use the crimping tool',2);
   if(t==='tester'){if(both()){K.view='test';return render()}return toast('Crimp both ends before testing.')}
   if(!E.st)return toast('Take the cable from the coil first.');
   if(t==='boot'){if(E.plug)return minor('Too late. The boot must go on BEFORE the plug',2);if(E.boot)return toast('There is already a boot on this end.');if(E.st==='reel')return toast('Cut the cable first.');E.boot=true;K.held=null;toast('Boot slid onto the cable.');return render()}
   if(t==='rj'){if(E.plug)return toast('There is already a plug on this end.');if(E.st!=='trimmed')return minor('The wires are not ready for a plug yet');if(!E.boot)ctx.penalty(2,'Forgot to slide the boot on before the plug');
    E.plug={f:E.L+26,flip:Math.random()<.5};K.held=null;toast('You took an RJ45 from the bin. Check which way the clip faces.');return render()}
   if(t==='stripper'){if(E.st==='cut'){ui={mode:'strip',y:TOP+20*MM};return render()}return toast(E.st==='reel'?'Cut a piece of cable first.':'This end is already stripped.')}
   if(t==='crimper'){const b=await bladePick();if(b)useCrimper(b)}
  }
  function useCrimper(b){const E=cur(),st=E.st,die=b.endsWith('p'),bad=m=>minor(m);
   if(st==='reel'){if(b==='cut'){E.st='cut';K.B=newEnd('cut');toast('Cut about 2 meters from the coil.');return render()}return bad(b==='strip'?'The stripper blade only scores the jacket. It cannot cut through the cable':'The dies are for crimping plugs, not for cutting cable')}
   if(st==='crimped'){if(b==='cut'){const bt=E.boot;Object.assign(E,newEnd('cut'),{boot:bt});toast('You cut off the plug. Strip and terminate this end again.');return render()}
    if(b==='8p'){ui.mode='squeeze';toast('Re-crimping the plug.');return render()}return bad(die?`The RJ45 plug does not fit the ${b.toUpperCase()} die`:'The stripper blade does nothing to a crimped plug')}
   if(st==='inserted'){if(b==='8p'){ui.mode='squeeze';return render()}if(b==='cut'){ctx.penalty(3,'Cut the wires right at the plug before crimping. Start this end again');const bt=E.boot;Object.assign(E,newEnd('cut'),{boot:bt});return render()}
    return bad(die?`The RJ45 plug does not fit the ${b.toUpperCase()} die`:'Wrong part of the crimper')}
   if(st==='cut'){if(b==='strip'){ui={mode:'strip',y:TOP+20*MM};return render()}if(b==='cut')return bad('You cut the end off instead of stripping it');return bad('There is no plug to crimp yet')}
   if(st==='stripped')return bad(b==='cut'?'Untwist and arrange the wires before trimming':'Wrong part of the crimper for this step');
   if(st==='untwisted'||st==='trimmed'){if(b==='cut'){if(E.plug)return toast('Put the plug aside before trimming again.');ui={mode:'trim',y:edgeY(E)-((E.L||E.strip)*MM)/2};return render()}if(b==='strip')return bad('The wires are already stripped. Stripping again would nick them');return bad('The plug is not on the wires yet')}
  }
  function nextHint(){const E=cur();const m=K.view==='test'?'Pick up the LAN tester from the bench and press ▶ Test. Read the LEDs.':!E.st?'Take the cable from the coil.':{reel:'Cut a piece of cable (crimper › cutter blade).',cut:E.boot?'Strip about 2.5 cm of jacket (cable stripper, or crimper › stripper blade).':'Slide a boot onto the cable first.',stripped:'Untwist each pair by dragging along it.',untwisted:'Arrange the wires to T568B, then trim them to about 13 mm (crimper › cutter blade).',trimmed:E.plug?'Clip facing DOWN, then drag the plug all the way down.':'Get an RJ45 from the bin.',inserted:'Check that the wires reach the end of the plug, then crimp with the 8P die and squeeze until it clicks.',crimped:'Do the other end, or test the cable.'}[E.st];
   if((f.nxs=(f.nxs||0)+1)<=8){ctx.R.pen+=1;renderSheet()}toast('💡 '+m)}
  function helpTester(){modal(`<h3>📖 Reading the LAN tester</h3><ul style="padding-left:18px;line-height:1.6"><li><b>Good straight-through cable:</b> the LEDs light in pairs 1-1, 2-2 … 8-8.</li><li><b>An LED that never lights:</b> that wire is <b>open</b>. It is not touching the pin (trimmed too short, plug not pushed all the way, or a weak crimp).</li><li><b>Wrong numbers</b> (e.g. 3 on the master, 6 on the remote): the wires are <b>in the wrong order</b>, or the plug went on upside-down (clip up), which reverses 1↔8.</li><li><b>G</b> stays off on unshielded (UTP) cable. That's normal.</li><li>After a pass, the assessor checks that the <b>jacket is inside the plug</b>.</li></ul><p class="muted small">To fix an end: crimper › cutter blade on that end cuts the plug off. Then terminate it again.</p><div class="row"><button class="btn" onclick="closeModal()">Got it</button></div>`)}
  function testerUI(){$('#tst',ctx.body).innerHTML=`<div class="tester"><div class="unit"><b>MASTER · End A</b><div class="leds">${[1,2,3,4,5,6,7,8,'G'].map(i=>`<span class="led" id="m${i}"><i></i>${i}</span>`).join('')}</div></div><div class="cablebar"></div><div class="unit"><b>REMOTE · End B</b><div class="leds">${[1,2,3,4,5,6,7,8,'G'].map(i=>`<span class="led" id="r${i}"><i></i>${i}</span>`).join('')}</div></div></div>
   <div id="tlog" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:monospace;min-height:24px"></div>
   <div class="row" style="justify-content:center;margin-top:6px"><button class="btn" id="run">▶ Test${f.runs?' again':''}</button></div><p class="small" style="text-align:center;margin:6px 0 0">End A goes in the MASTER, End B in the REMOTE.</p>`;
   $('#run',ctx.body).onclick=runTest}
  let testing=false;
  async function runTest(){if(testing)return;if(K.held!=='tester'){K.held='tester';toast('You picked up the LAN tester and plugged in both ends.');render();setTimeout(runTest,600);return}testing=true;f.runs=(f.runs||0)+1;
   const a=endPins(K.A),b=endPins(K.B),off=()=>$$('.led',ctx.body).forEach(l=>l.classList.remove('on')),lg=$('#tlog',ctx.body);lg.innerHTML='';
   for(let rep=0;rep<2;rep++)for(let i=0;i<8;i++){off();const w=a[i],j=w?b.indexOf(w):-1;const m=$('#m'+(i+1),ctx.body);if(!m){testing=false;return}
    if(j>=0){m.classList.add('on');$('#r'+(j+1),ctx.body).classList.add('on')}if(!rep)lg.innerHTML+=`<span style="background:#0008;color:#fff;padding:2px 8px;border-radius:6px">${i+1}→${j>=0?j+1:'–'}</span>`;await sleep(420)}
   off();testing=false;
   const pass=a.every((k,i)=>k===T568B[i])&&b.every((k,i)=>k===T568B[i]);
   if(!pass){const iss=[...endIssues(K.A,'A'),...endIssues(K.B,'B')];f.lastIssues=iss;
    if((f.fails=(f.fails||0)+1)<=4)ctx.penalty(6,'Cable failed the LAN tester');else toast('✖ Cable failed the LAN tester','bad');
    iss.forEach(x=>{if(!ctx.R.log.some(l=>l[1]===x))ctx.R.log.push(['info',x])});
    return modal(`<h3>❌ The cable failed</h3><p>The LEDs did not light up 1-1, 2-2 … 8-8. Look at what the tester showed and decide which end is bad.</p><p class="muted small">To redo an end: switch to that end, use the crimper's <b>cutter blade</b> to cut the plug off, then terminate it again. A weak crimp can sometimes be fixed by crimping again with the 8P die.</p><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}
   const jk=[['A',K.A],['B',K.B]].filter(([n,E])=>E.plug.f>14).map(x=>x[0]);
   if(jk.length){ctx.penalty(5,`Assessor rejected the cable: the jacket is not inside the plug on End ${jk.join(' & ')}`);
    return modal(`<h3>👩‍🏫 Inspection failed</h3><p>The tester passed, but the jacket on <b>End ${jk.join(' & ')}</b> is not inside the plug. The bare wires would break when the cable is pulled.</p><p class="muted small">Cut off that plug and redo the end. Trim the wires to about 13 mm.</p><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}
   L.made++;ctx.good(`Cable ${L.made} passed the tester (1-1 … 8-8) and inspection.`);toast(`✔ Cable ${L.made} passed!`,'good');K.held=null;
   Object.assign(K,{view:'A',A:newEnd('reel'),B:newEnd('cut')});f.runs=0;ctx.check();render()}
  render();
 }};

/* ---------- Task 2: Patch the network ---------- */
TASKS.c2_patch={id:'c2_patch',coc:2,title:'Connect the network devices',where:'Network Rack',
 info:'Network diagram:\n\nISP Modem (LAN) ──▶ Router (WAN)\nRouter (LAN) ──▶ Switch\nSwitch ──▶ PC-01\nSwitch ──▶ PC-02\n\nThen power on the router and the switch.',
 objectives:[{id:'wan',text:'Connect the ISP modem to the router\'s WAN (internet) port',hint:'The blue WAN port is for the internet line from the ISP modem.',check:L=>L.patch.some(([x,y])=>[x,y].includes('rt.WAN')&&[x,y].some(p=>p.startsWith('ont.')))},
  {id:'up',text:'Connect a router LAN port to the switch (uplink)',hint:'Router LAN1–4 ↔ any switch port. Never use the WAN port for the switch.',check:L=>L.patch.some(([x,y])=>{const p=[x,y].sort();return p[0].startsWith('rt.LAN')&&p[1].startsWith('sw.')})},
  {id:'pc1',text:'Connect PC-01 to the switch',hint:'Tap PC-01 NIC, then a free switch port.',check:L=>L.patch.some(([x,y])=>[x,y].includes('pc1.NIC')&&[x,y].some(p=>p.startsWith('sw.')))},
  {id:'pc2',text:'Connect PC-02 to the switch',hint:'Tap PC-02 NIC, then a free switch port.',check:L=>L.patch.some(([x,y])=>[x,y].includes('pc2.NIC')&&[x,y].some(p=>p.startsWith('sw.')))},
  {id:'pwr',text:'Power on the router and the switch (link lights on)',hint:'Press the power buttons on the router and the switch.',check:L=>L.pw.rt&&L.pw.sw}],
 start(ctx){
  const L=ctx.L;let sel=null;
  const used=p=>L.patch.find(c=>c.includes(p));
  const lit=p=>{const c=used(p);if(!c)return false;const o=c[0]===p?c[1]:c[0];const pw=x=>{const d=x.split('.')[0];return PORTS[d].power?L.pw[PORTS[d].power]:true};return pw(p)&&pw(o)};
  const render=()=>{
   const dev=k=>{const d=PORTS[k];return `<div class="dev"><span class="nm">${d.name}</span><div class="ports">${d.ports.map(p=>{const id=k+'.'+p;return `<button class="port ${p==='WAN'?'wan':''} ${sel===id?'sel':''} ${used(id)?'used':''}" data-p="${id}"><span class="lk ${lit(id)?'on':''}"></span>${p}</button>`}).join('')}</div>${d.power?`<button class="pwr ${L.pw[d.power]?'on':''}" data-pw="${d.power}">⏻ ${L.pw[d.power]?'ON':'OFF'}</button>`:''}</div>`};

   onRelease:p=>{cu.close();cu=null;const full=p>=100,half=p>=30;

    $('#pvA').onclick=()=>{closeModal();go()};$('#pvM').onclick=()=>{closeModal();leave()}},
   onCancel:leave})}

 $('#pvBack').onclick=leave;go();
}
